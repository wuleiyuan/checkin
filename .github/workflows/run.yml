name: run

# 2026-11-19 修订：定时签到班次已移除，GitHub 侧只负责巡检 + 告警 + 手动诊断。
#
# 为什么删：
#   GLaDOS 2026-11 起要求 Cloudflare Turnstile token。托管 runner 是数据中心 IP，
#   CF 的 pat 端点返回 401，Turnstile 组件不渲染，token 恒为 0 → 接口 code:5。
#   2026-11-14 三轮实测（有界面 Chrome + xvfb、强制 IPv4、webdriver=false 全试过）
#   与 2026-11-19 复核结论一致：
#     - sitekey 0x4AAAAAAFF5pkT0bg7fX7nw 未变
#     - challenge 接口正常下发 nonce / ttl=300s
#     - proof = SHA256(nonce + ".glados-observe-v1") 服务端仍然接受
#     - 唯一缺的就是第 3 步 turnstile token，托管 runner 生成不出来
#   这是 CF 对机房 IP 的策略，不是代码 bug，改代码修不了。
#   之前每天 08:17 跑一班注定 code:5 的签到，靠 EXPECT_TURNSTILE_BLOCK 记成
#   「跳过」装绿灯，属于自欺：Actions 绿了，签到并没有发生。现在不再留这个班次。
#
# 现在的分工：
#   真签到  → 本机真实 Chrome（launchd 08:30/09:30/21:30/21:45 + WorkBuddy 自动化）
#   巡检    → 本仓库 22:23（UTC 14:23）核对积分流水，漏签才推送提醒
#   诊断    → 手动 workflow_dispatch，能看到真实 code:5 原始返回
#
# 想让 GitHub 真正自主签到，唯一路径是 self-hosted runner（家宽住宅 IP + 真实 Chrome）：
#   1. 在常开设备上装 actions runner（不要用会睡眠的 Mac），label 加 glados
#   2. 把下面 runs-on 改为 [self-hosted, glados]
#   3. schedule 里加回 '17 0 * * *'
#
# monitor.js 只认积分流水里的硬证据：detail == 目标日(Asia/Shanghai) 且
# business == system:checkin，不依赖页面文字，也不关心是哪一端签的。
# 流水只能证明「账号没漏签」，不能证明「自动签到程序成功」——人工补签留的
# 记录完全一样。自动签到健康度以本机 state.json 的 lastAutoDate 为准。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'checkin=只跑云端签到诊断(会看到真实 code:5)；其它=只巡检'
        required: false
        default: 'monitor'
        type: choice
        options:
          - monitor
          - checkin
  schedule:
    # UTC 14:23 = 北京 22:23：本地两班之后做兜底复核
    - cron: '23 14 * * *'

permissions:
  contents: read

jobs:
  glados:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      # 只保留手动诊断入口。不设 EXPECT_TURNSTILE_BLOCK，失败就红，
      # 让人看到真实的 code:5，而不是被包装成「跳过」。
      - name: 云端签到（仅手动诊断）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'checkin' }}
        run: npm run main
        env:
          GLADOS: ${{ secrets.GLADOS }}
          TURNSTILE_TOKEN: ${{ secrets.TURNSTILE_TOKEN }}
          NOTIFY: ''

      # 复核：已签到静默绿灯；真漏签 / Cookie 失效才推送提醒
      - name: 兜底巡检
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '23 14 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode != 'checkin') }}
        run: npm run monitor
        env:
          GLADOS: ${{ secrets.GLADOS }}
          NOTIFY: ${{ secrets.NOTIFY }}
